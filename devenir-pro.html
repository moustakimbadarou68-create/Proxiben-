<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Devenir professionnel - ProxiBen</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fa;
  color:#172033;
}

header{
  background:white;
  padding:18px 20px;
  border-bottom:1px solid #eee;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#087f5b;
}

.container{
  max-width:700px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  margin-bottom:10px;
}

.intro{
  text-align:center;
  color:#667085;
  line-height:1.5;
  margin-bottom:30px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:25px;
  padding:15px;
  background:#087f5b;
  color:white;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#087f5b;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    Proxi<span>Ben</span>
  </div>
</header>

<div class="container">

  <div class="card">

    <h1>Devenir professionnel</h1>

    <p class="intro">
      Présentez votre activité sur ProxiBen
      et permettez à de nouveaux clients de vous trouver.
    </p>

    <form>

      <label>Nom complet</label>
      <input
        type="text"
        placeholder="Ex : Jean Dupont"
        required
      >

      <label>Numéro de téléphone</label>
      <input
        type="tel"
        placeholder="Ex : 97 00 00 00"
        required
      >

      <label>Métier</label>

      <select required>
        <option value="">Choisir votre métier</option>
        <option>Électricien</option>
        <option>Plombier</option>
        <option>Mécanicien</option>
        <option>Réparateur téléphone</option>
        <option>Informaticien</option>
        <option>Climaticien</option>
        <option>Coiffeur</option>
        <option>Couturier</option>
        <option>Autre</option>
      </select>

      <label>Ville</label>

      <select required>
        <option value="">Choisir votre ville</option>
        <option>Cotonou</option>
        <option>Abomey-Calavi</option>
        <option>Porto-Novo</option>
        <option>Parakou</option>
        <option>Abomey</option>
        <option>Allada</option>
        <option>Autre</option>
      </select>

      <label>Décrivez vos services</label>

      <textarea
        placeholder="Décrivez votre activité et les services que vous proposez..."
      ></textarea>

      <button type="submit">
        Envoyer ma demande
      </button>

    </form>

    <a href="index.html" class="back">
      ← Retour à ProxiBen
    </a>

  </div>

</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const supabaseClient = supabase.createClient(
    "https://dnshtdmnohwwmmtqlnst.supabase.co",
    "sb_publishable_UawwJPFPtpSjDGkIRLfykQ_X_ykqMgc"
  );

  const form = document.querySelector("form");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = new FormData(form);

    const { error } = await supabaseClient
      .from("professionnels")
      .insert({
        nom: data.get("nom"),
        numero: data.get("numero"),
        ville: data.get("ville"),
        metier: data.get("metier"),
        services: data.get("services")
      });

    if (error) {
      alert("Erreur lors de l'envoi.");
      console.error(error);
      return;
    }

    alert("Votre demande a été envoyée avec succès !");
    form.reset();
  });
</script>
</html>
